slam_toolbox:
  ros__parameters:
    # Frame configuration
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    scan_queue_size: 5  # Reduced for local network (was 10)

    # Map publishing configuration
    map_name: /map
    
    # Core SLAM parameters
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    
    # Loop closure
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    
    # Mapping parameters
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.15
    transform_publish_period: 0.02
    map_update_interval: 5.0

    # Motion model
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    tf_buffer_duration: 30.0  # Reduced for local network (was 60.0)
    transform_timeout: 1.0    # Reduced for local network (was 5.0)
    
    # Interactive mode
    enable_interactive_mode: true
    interactive_mode: false

    # General scan matching - rely on LiDAR, not odometry
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.3
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters - BALANCED for good wheel traction
    # Calibration test showed only ~0.5% wheel slip (1.78° drift on 360° rotation)
    distance_variance_penalty: 0.5      # Moderate trust in odometry position
    angle_variance_penalty: 0.5         # Moderate trust in odometry angles
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349   # 20° search window (good odometry)
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
