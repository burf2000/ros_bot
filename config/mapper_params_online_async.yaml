slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan  # LD06 publishes at 10Hz
    scan_queue_size: 20  # Increased from default 1 - handle 10Hz LD06 (2 seconds of scans)
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: /home/burf2000/dev_ws/my_map_serial  # Comment out to start fresh
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false  # Set to false to create a new map

    debug_logging: false
    throttle_scans: 1  # Process all throttled scans (already throttled to 5Hz by topic_tools)
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.05  # LD06 min is 2cm, filter below 5cm for safety
    max_laser_range: 12.0  # LD06 max range is 12m (was 5.0 for XV-11)
    minimum_time_interval: 0.2  # At 10Hz lidar with throttle=2, effective 5Hz (200ms/scan)
    transform_timeout: 1.0  # Increased from 0.5 - WiFi latency between robot and desktop
    tf_buffer_duration: 60.  # Increased from 30 - hold older transforms for delayed scans
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15  # Reduced from 0.5 - update map more frequently
    minimum_travel_heading: 0.15   # Reduced from 0.5 (28°) to 0.15 (~8.5°) - better rotation tracking
    scan_buffer_size: 25  # Increased from 10 - handle faster scan rate (10Hz * 2.5s = 25 scans)
    scan_buffer_maximum_scan_distance: 12.0  # Increased from 10.0 - LD06 has 12m range
    link_match_minimum_response_fine: 0.3  # Increased from 0.2 - LD06 is cleaner, can be more selective
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 6.0  # Increased from 3.0 - LD06 has much better long-range accuracy
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # VERY LOW penalties = trust odometry minimally, rely almost entirely on scan matching
    # Calibration test showed 86% wheel slip during rotation!
    distance_variance_penalty: 0.1      # Minimal trust in odometry position
    angle_variance_penalty: 0.05        # Almost no trust in odometry angles (86% slip!)

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.785     # 45° search (was 30°) - odometry rotation very unreliable
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
