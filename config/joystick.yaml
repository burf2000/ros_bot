joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.25  # Reduced from 0.5 - slower forward speed
    scale_linear_turbo:
      x: 0.5   # Reduced from 1.0 - slower turbo speed

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.5  # Kept the same - turning speed is good
    scale_angular_turbo:
      yaw: 1.0  # Kept the same


    enable_button: 6
    enable_turbo_button: 7
    # Dead mans switch
    require_enable_button: true