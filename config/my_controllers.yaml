controller_manager:
  ros__parameters:
    update_rate: 30

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_footprint

    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.280
    wheel_radius: 0.0325

    use_stamped_vel: false  # Use standard Twist messages on cmd_vel_unstamped

    odom_frame_id: odom
    # MASSIVE wheel slip during rotation on smooth floor (test showed 86% slip!)
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 1.0]    # yaw: very uncertain
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 1.0]   # yaw_dot: very uncertain
    open_loop: false
    enable_odom_tf: false  # EKF will publish odom->base_footprint transform



    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10

    # Velocity limits tuned for LD06 lidar (10Hz scan rate)
    # At 10Hz, scans are 100ms apart
    # Linear: 0.26 m/s × 0.1s = 2.6cm between scans (very safe)
    # Angular: 0.5 rad/s × 0.1s = 0.05 rad = 2.9° between scans (excellent for SLAM)
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.26  # m/s - conservative for stable mapping
    linear.x.min_velocity: -0.26
    linear.x.max_acceleration: 1.0  # m/s²
    linear.x.min_acceleration: -1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 0.5  # rad/s (~28°/s) - safe for 10Hz lidar
    angular.z.min_velocity: -0.5
    angular.z.max_acceleration: 2.0  # rad/s²
    angular.z.min_acceleration: -2.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0