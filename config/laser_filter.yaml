scan_to_scan_filter_chain:
  ros__parameters:
    filter_type: "scan_to_scan_filter_chain"
    filter_chain:
      - name: range
        type: "laser_filters/LaserScanRangeFilter"
        params:
          use_message_range_limits: false
          lower_threshold: 0.1
          upper_threshold: 5.0

      - name: speckle
        type: "laser_filters/LaserScanSpeckleFilter"
        params:
          filter_type: 1
          max_range: 5.0
          max_range_difference: 0.15
          filter_window: 2
